name: Publicar webs

# En cada cambio en main: genera /docs y lo publica en la rama gh-pages,
# que es la que sirve GitHub Pages (https://mazureof.github.io/demo-cafeteria/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: imagenes-${{ hashFiles('comercios/**') }}
          restore-keys: imagenes-
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Publicar en gh-pages
        run: |
          cd docs
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publicar webs (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
